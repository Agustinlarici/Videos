<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-il-rumore"
        class="scene"
        data-composition-id="01-il-rumore"
        data-composition-src="compositions/frames/01-il-rumore.html"
        data-start="0"
        data-duration="5.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-la-lettura"
        class="scene"
        data-composition-id="02-la-lettura"
        data-composition-src="compositions/frames/02-la-lettura.html"
        data-start="5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-la-priorita"
        class="scene"
        data-composition-id="03-la-priorita"
        data-composition-src="compositions/frames/03-la-priorita.html"
        data-start="10"
        data-duration="5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-il-rumore", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 5);
        tl.fromTo("#el-02-la-lettura", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 5);
        tl.to("#el-02-la-lettura", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-la-priorita", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.to({}, { duration: 15 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
