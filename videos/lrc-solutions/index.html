<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-chi-siamo"
        class="scene"
        data-composition-id="01-chi-siamo"
        data-composition-src="compositions/frames/01-chi-siamo.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-cosa-facciamo"
        class="scene"
        data-composition-id="02-cosa-facciamo"
        data-composition-src="compositions/frames/02-cosa-facciamo.html"
        data-start="3"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-per-chi"
        class="scene"
        data-composition-id="03-per-chi"
        data-composition-src="compositions/frames/03-per-chi.html"
        data-start="6.5"
        data-duration="4.9"
        data-track-index="0"
      ></div>

      <div
        id="el-04-chiudiamo"
        class="scene"
        data-composition-id="04-chiudiamo"
        data-composition-src="compositions/frames/04-chiudiamo.html"
        data-start="11"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-chi-siamo", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 3);
        tl.fromTo("#el-02-cosa-facciamo", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 3);
        tl.to("#el-02-cosa-facciamo", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 6.5);
        tl.fromTo("#el-03-per-chi", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 6.5);
        tl.to("#el-03-per-chi", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 11);
        tl.fromTo("#el-04-chiudiamo", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 11);
        tl.to({}, { duration: 15 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
