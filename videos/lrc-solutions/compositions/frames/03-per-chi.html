      <script>

            { opacity: 0, x: -36, y: 22 },
            { opacity: 1, x: 0, y: 0, duration: CARD_DUR, ease: "power3.out" },

            "#pc03-card-2",
            { opacity: 0, x: -36, y: 22 },
            { opacity: 1, x: 0, y: 0, duration: CARD_DUR, ease: "power3.out" },
            CARD2_AT,

          tl.fromTo(
            "#pc03-card-3",
            { opacity: 0, x: -36, y: 22 },
            { opacity: 1, x: 0, y: 0, duration: CARD_DUR, ease: "power3.out" },
            CARD3_AT,

          // per-word body reveal, immediately after each card lands
          var WORD_DUR = 0.28;
          var WORD_STAGGER = 0.05;

          function revealWords(selector, at) {
            tl.fromTo(
              selector,
              { opacity: 0, y: 10 },
              { opacity: 1, y: 0, duration: WORD_DUR, ease: "power2.out", stagger: WORD_STAGGER },
              at,
            );

          revealWords("#pc03-body-3 .pc03-word", CARD3_AT + CARD_DUR);
