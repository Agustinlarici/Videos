  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Rings: very slow fade-in as the stage clears (atmosphere, not a focal move).
      tl.fromTo(
        ".lp3-ring",
        { opacity: 0 },
        { opacity: 1, duration: 1.6, ease: "power1.out" },
        0.2,
      );

      // --- Scene 1 (0.0–1.2s): dashboard stand-in clears the stage ---
      // scale-swap-transition — exit half only (no incoming card in this frame; the
      // "incoming" state is the empty cream canvas the tagline will build on).
      gsap.set("#lp3-dash", { scale: 1, opacity: 1 });
      tl.to(
        "#lp3-dash",
        { scale: 0.7, opacity: 0, duration: 0.42, ease: "power2.in" },
        0.15,
      );

      // --- Scene 2 (1.2–3.2s): tagline assembles, word by word, fade-through-grey ---
      var GREY = "#9a9a9a";
      var DARK = "#0f1117";
      var COBALT = "#2563eb";
      var WORD_DUR = 0.4;
      var STAGGER = 0.12;

      gsap.utils.toArray("#lp3-line1 .lp3-word").forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 10, color: GREY },
          { opacity: 1, y: 0, color: DARK, duration: WORD_DUR, ease: "power2.out" },
          1.2 + i * STAGGER,
        );
      });

      gsap.utils.toArray("#lp3-line2 .lp3-word").forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 10, color: GREY },
          { opacity: 1, y: 0, color: COBALT, duration: WORD_DUR, ease: "power2.out" },
          1.9 + i * STAGGER,
        );
      });

      // --- Scene 3 (3.2–5.0s): the wordmark settles beneath the tagline, lockup holds ---
      tl.fromTo(
        "#lp3-accent",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out" },
        3.1,
      );

      // spring-pop-entrance — whole-word pop, smooth power3, no overshoot.
      tl.fromTo(
        "#lp3-brand .lp3-wordmark",
        { scale: 0, opacity: 0, y: 10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        3.2,
      );

      // sine-wave-loop — final held beat, low-amplitude jitter only (this is the video's
      // one deliberate long hold and its real exit: no clearing animation follows).
      var phase = { p: 0 };
      var brand = document.querySelector("#lp3-brand");
      var IDLE_START = 3.9;
      var IDLE_DUR = 5.0 - IDLE_START;
      var CYCLES = 0.5;
      var Y_AMP = 2;
      var SCALE_AMP = 0.01;
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(phase.p);
            brand.style.transform =
              "translateY(" + (s * Y_AMP).toFixed(3) + "px) scale(" + (1 + s * SCALE_AMP).toFixed(4) + ")";
          },
        },
        IDLE_START,
      );

      window.__timelines["03-la-priorita"] = tl;
      tl.seek(0);
    })();
  </script>
