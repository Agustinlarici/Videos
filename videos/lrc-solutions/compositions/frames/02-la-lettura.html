<template>
  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
      src: url("assets/fonts/Inter-Regular.woff2") format("woff2");
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    }

    .ll2-bg {
      position: absolute;
      inset: 0;
      background: #ffffff;
    }

    /* ambient-glow-bloom — soft cobalt halo, sits behind the morph card so it only
       bleeds through the thin gap that opens while the card tightens (the "seam"). */
    .ll2-glow-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .ll2-glow {
      position: absolute;
      width: 1200px;
      height: 1200px;
      border-radius: 50%;
      opacity: 0;
      background: radial-gradient(
        circle,
        rgba(14, 32, 170, 0.55) 0%,
        rgba(14, 32, 170, 0.22) 42%,
        rgba(14, 32, 170, 0) 72%
      );
    }

    /* card-morph-anchor — one container morphs scale + border-radius; old/new photo
       content cross-fades inside it. Never a hard cut. */
    .ll2-morph-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ll2-morph-card {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      border-radius: 0px;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    .ll2-layer {
      position: absolute;
      inset: 0;
    }
    .ll2-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .ll2-layer--old {
      opacity: 1;
    }
    .ll2-layer--new {
      opacity: 0;
    }
    .ll2-scrim {
      position: absolute;
      inset: 0;
      background: rgba(6, 10, 26, 0.42);
      pointer-events: none;
    }

    /* Scene 3 — the solution line, in a card-tinted band (frame.md: 4% cobalt fill,
       20% cobalt border, 14px radius), kept clear of the bottom keep-out. */
    .ll2-copy-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 224px; /* band bottom lands ~856px, well above the 896px cutoff */
      pointer-events: none;
    }
    .ll2-copy-band {
      opacity: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 38px;
      border-radius: 14px;
      border: 1.5px solid rgba(37, 99, 235, 0.2);
      background: linear-gradient(rgba(37, 99, 235, 0.04), rgba(37, 99, 235, 0.04)), rgba(8, 12, 30, 0.46);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .ll2-word {
      display: inline-block;
      font-size: 44px;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: #f3f5ff;
      opacity: 0;
      will-change: transform, opacity;
    }
    .ll2-word--accent {
      color: #2563eb;
    }
  </style>

  <div id="root" data-composition-id="02-la-lettura" data-width="1920" data-height="1080" data-duration="5.5">
    <div id="ll2-bg" class="ll2-bg clip" data-start="0" data-duration="5.5" data-track-index="0"></div>

    <div id="ll2-glow-stage" class="ll2-glow-stage clip" data-start="0" data-duration="5.5" data-track-index="1">
      <div class="ll2-glow" id="ll2-glow"></div>
    </div>

    <div id="ll2-morph-stage" class="ll2-morph-stage clip" data-start="0" data-duration="5.5" data-track-index="2">
      <div class="ll2-morph-card" id="ll2-card">
        <div class="ll2-layer ll2-layer--old" id="ll2-old">
          <img src="assets/automazione-in-ambiente-industriale-mode.jpg" alt="" />
        </div>
        <div class="ll2-layer ll2-layer--new" id="ll2-new">
          <img src="assets/dashboard-di-business-intelligence-con-g.jpg" alt="" />
        </div>
        <div class="ll2-scrim"></div>
      </div>
    </div>

    <div id="ll2-copy-stage" class="ll2-copy-stage clip" data-start="0" data-duration="5.5" data-track-index="3">
      <div class="ll2-copy-band" id="ll2-copy">
        <span class="ll2-word">Trasforma</span>
        <span class="ll2-word">i</span>
        <span class="ll2-word">dati</span>
        <span class="ll2-word">in</span>
        <span class="ll2-word ll2-word--accent">decisioni</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // --- Scene 1 (0.0–1.0s): continues Frame 1's held photo one beat longer — full-bleed,
      // static, still dimmed, no text. Initial DOM state already matches: old layer opaque,
      // new layer hidden, card full-bleed (scale 1, radius 0) — nothing tweens yet. ---

      // --- Scene 2 (1.0–3.2s): card-morph-anchor — the photo's apparent surface tightens
      // toward frame.md's 14px card radius as the industrial photo resolves into the
      // dashboard photo revealed beneath it, then releases back out to full-bleed. One
      // continuous transformation, never a hard cut. ---
      var MORPH_START = 1.0; // HOLD_BEAT before morphing
      var MORPH_DUR = 1.0;
      var END_SCALE = 0.93;
      var SHOT_TWO_RADIUS = 14; // frame.md card-lg radius
      var OLD_FADE_FRAC = 0.45;
      var NEW_FADE_FRAC = 0.45;

      // One tween, all morph channels in lockstep (scale substitutes for width/height).
      tl.to(
        "#ll2-card",
        {
          scale: END_SCALE,
          borderRadius: SHOT_TWO_RADIUS / END_SCALE, // pre-scale so the APPARENT radius lands at 14px
          duration: MORPH_DUR,
          ease: "power2.inOut",
        },
        MORPH_START,
      );
      tl.to(
        "#ll2-old",
        { opacity: 0, duration: MORPH_DUR * OLD_FADE_FRAC, ease: "power1.in" },
        MORPH_START,
      );
      tl.to(
        "#ll2-new",
        { opacity: 1, duration: MORPH_DUR * NEW_FADE_FRAC, ease: "power1.out" },
        MORPH_START + MORPH_DUR * (1 - NEW_FADE_FRAC),
      );

      // ambient-glow-bloom (bloom-and-hold variation — scene <3s, single fromTo is the
      // whole recipe) — un-triggered soft cobalt bloom marks the seam. BLOOM_START + DUR
      // lands exactly where the card is tightest and the crossfade completes: one beat.
      var BLOOM_START = 1.3;
      var BLOOM_DUR = 0.7;
      var GLOW_PEAK_OPACITY = 0.3;
      tl.fromTo(
        "#ll2-glow",
        { opacity: 0, scale: 0.85 },
        { opacity: GLOW_PEAK_OPACITY, scale: 1, duration: BLOOM_DUR, ease: "power2.out" },
        BLOOM_START,
      );
      // Finite decay as the card releases back to full-bleed — no lingering halo into Scene 3.
      tl.to("#ll2-glow", { opacity: 0, duration: 0.8, ease: "power1.in" }, 2.2);

      // Release — the card expands back to full-bleed; "settles full-bleed" lands at 3.2s,
      // the top of Scene 3. Same ease family as the tighten (recipe: mixed eases read
      // unsynchronized).
      var RELEASE_START = MORPH_START + MORPH_DUR; // 2.0
      var RELEASE_DUR = 3.2 - RELEASE_START; // 1.2
      tl.to(
        "#ll2-card",
        { scale: 1, borderRadius: 0, duration: RELEASE_DUR, ease: "power2.inOut" },
        RELEASE_START,
      );

      // --- Scene 3 (3.2–5.0s): the dashboard photo is focal, full-bleed. The site's own
      // solution line lands as a per-word staggered fade inside a card-tinted band, clear
      // of the bottom keep-out, then holds still. ---
      tl.fromTo("#ll2-copy", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 3.35);

      var WORD_START = 3.55;
      var WORD_DUR = 0.5;
      var STAGGER = 0.14;
      gsap.utils.toArray(".ll2-word").forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, x: -16 },
          { opacity: 1, x: 0, duration: WORD_DUR, ease: "power2.out" },
          WORD_START + i * STAGGER,
        );
      });
      // Lands by ~4.6s, holds still through 5.0s — no exit (non-final frame; the root
      // transition owns the cut out).

      window.__timelines["02-la-lettura"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
